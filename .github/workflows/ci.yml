name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The release line is integration, and CI does not run on pushes to it. That
  # left the branch that actually ships with no way to be verified in CI at all,
  # so a release could only ever rest on someone's local run.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: checkout lattice-node-agent
        uses: actions/checkout@v6
        with:
          path: lattice-node-agent
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          check-latest: true
          cache: false
      - name: gofmt
        working-directory: lattice-node-agent
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: release workflow contract
        working-directory: lattice-node-agent
        run: sh scripts/check-release-workflow.sh
      - name: install integrity contract
        working-directory: lattice-node-agent
        run: sh scripts/test-install-integrity.sh
      - name: vet
        working-directory: lattice-node-agent
        run: go vet ./...
      - name: test
        working-directory: lattice-node-agent
        run: go test -race -cover ./...
      - name: gosec
        working-directory: lattice-node-agent
        # Inside the module, like vet and test. Run from the parent directory,
        # gosec v2.29.0 loaded no package and passed with "Files: 0", so the
        # step also fails when the scan covered no file or could not load a
        # package, the same silent miss in another form. -exclude-generated
        # skips protoc output (stats.pb.go), whose unsafe calls are protobuf's
        # own and would be rewritten by the next regeneration.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          status=0
          gosec -exclude-generated -fmt=json -out="$RUNNER_TEMP/gosec.json" -stdout -verbose=text ./... || status=$?
          if ! jq -e '.Stats.files > 0 and ((."Golang errors" // {}) | length) == 0' "$RUNNER_TEMP/gosec.json" >/dev/null; then
            echo "::error::gosec scanned no file or could not load a package"
            jq -c '{files: .Stats.files, load_errors: (."Golang errors" // {} | keys)}' "$RUNNER_TEMP/gosec.json" || true
            exit 1
          fi
          exit "$status"
      - name: govulncheck
        working-directory: lattice-node-agent
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
